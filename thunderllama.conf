# ThunderLLAMA 统一配置文件
# 版本: 1.0
# 最后更新: 2026-03-13
# 说明: 所有 ThunderLLAMA 优化配置的唯一真相源

# ============================================================================
# 模型配置
# ============================================================================
MODEL_PATH="$HOME/models/qwen3-30b-a3b-gguf/Qwen3-30B-A3B-128K-Q5_K_M.gguf"
MODEL_TYPE="30B-Q5"
CONTEXT_SIZE=4096

# ============================================================================
# ThunderLLAMA 特有优化（核心特性）
# ============================================================================

# LMCache 配置
THUNDER_LMCACHE=1                                                      # 启用 LMCache
THUNDER_LMCACHE_DISK_PATH="/Volumes/toshiba/thunderllama-cache/kv_cache.bin"  # L3 磁盘缓存路径
THUNDER_PREFIX_MATCHING=1                                              # 前缀匹配（RAG/多轮对话加速）

# Paged Attention（实测：-40% 内存，+50% 并发，无质量损失）
LLAMA_PAGED_ATTENTION=1

# Chunk Prefill（长 prompt 平滑首 token 延迟）
THUNDERLLAMA_CHUNK_PREFILL=1

# ============================================================================
# KV Cache 策略配置（通过 API 设置）
# ============================================================================
KV_CACHE_STRATEGY="fixed"        # 策略类型: fixed | threshold | adaptive
KV_CACHE_LEVEL="q4_0"            # 量化级别: f16 | q8_0 | q4_0
# 说明: Q4 量化节省 72% 内存，性能损失仅 4%，质量无明显损失

# ============================================================================
# 服务器基础配置
# ============================================================================
SERVER_PORT=30000
GPU_LAYERS=99                    # GPU offload 层数（99 = 全部）
PARALLEL_SLOTS=4                 # 并发槽位数

# ============================================================================
# 性能优化参数
# ============================================================================

# Flash Attention（10-30% 吞吐量提升）
FLASH_ATTENTION="on"             # on | off | auto

# Batch 配置
BATCH_SIZE=4096                  # 逻辑 batch size
UBATCH_SIZE=1024                 # 物理 batch size

# Continuous Batching
CONT_BATCHING=1                  # 动态批处理（默认启用）
PRIO_BATCH=2                     # 批处理优先级（0=normal, 3=realtime）

# Cache 配置
CACHE_REUSE=256                  # KV shifting 重用缓存（chunk size）
CACHE_RAM=16384                  # 内存缓存大小 (MB)
KV_UNIFIED=1                     # 统一 KV buffer（减少内存碎片）

# CPU 配置
CPU_THREADS=8                    # 推理线程数
CPU_THREADS_BATCH=8              # 批处理线程数
CPU_MASK="0xFF"                  # CPU 亲和性（绑定到性能核）
PROCESS_PRIORITY=2               # 进程优先级（0=normal, 3=realtime）

# Metal/GPU 优化（macOS M4 Pro 特有）
NO_HOST=0                        # 绕过 host buffer（1=启用，可能不稳定）
METAL_MAX_BUFFER_SIZE=40000000000  # Metal 最大工作集 (40 GB)

# ============================================================================
# 已验证无效的优化（不要使用！）
# ============================================================================
# ❌ Speculative Decoding (Draft Model): 质量下降，性能无提升
#    原因: 30B 模型验证成本高，0.6B draft 预测准确率低
#    记录: Cortex thunderllama-30b-spec-failed-2026
#
# ❌ N-gram Speculative Decoding: 质量下降，性能无提升
#    原因: N-gram 预测对大模型帮助有限
#
# SPECULATIVE_DECODING=0  # 强制禁用
# DRAFT_MODEL=""
# SPEC_TYPE="none"

# ============================================================================
# 日志和监控
# ============================================================================
LOG_FILE="/tmp/llama-server-30b.log"
VERBOSE=0                        # 详细日志（0=关闭，1=启用）

# ============================================================================
# 实验性功能（谨慎启用）
# ============================================================================
# 以下功能未充分测试，可能不稳定

# Auto-fit memory（自动调整参数以适应内存）
AUTO_FIT=1                       # 1=启用（默认）

# SWA (Sliding Window Attention) 完整缓存
SWA_FULL=0                       # 0=禁用（默认）

# Graph reuse（计算图复用）
GRAPH_REUSE=1                    # 1=启用（默认）

# ============================================================================
# 环境变量映射（不要手动修改）
# ============================================================================
# 以下变量会自动从上述配置生成
# THUNDER_LMCACHE
# THUNDER_LMCACHE_DISK_PATH
# THUNDER_PREFIX_MATCHING
# LLAMA_PAGED_ATTENTION
# THUNDERLLAMA_CHUNK_PREFILL
# GGML_METAL_MAX_BUFFER_SIZE

# ============================================================================
# 配置验证和预检查
# ============================================================================

