# ThunderLLAMA 统一配置文件
# 版本: 1.1
# 最后更新: 2026-03-15
# 说明: 所有 ThunderLLAMA 优化配置的唯一真相源

# ============================================================================
# 模型配置
# ============================================================================
MODEL_PATH="/Users/lisihao/models/qwen3-30b-a3b-gguf/Qwen3-30B-A3B-128K-Q4_K_M.gguf"
MODEL_TYPE="30B-Q4"
CONTEXT_SIZE=16384

# ============================================================================
# ThunderLLAMA 特有优化（核心特性）
# ============================================================================

# LMCache 配置
THUNDER_LMCACHE=1
THUNDER_LMCACHE_DISK_PATH="/Volumes/toshiba/thunderllama-cache/kv_cache.bin"
THUNDER_PREFIX_MATCHING=1
THUNDER_LMCACHE_EXCLUSIVE=1  # 禁用内置 prompt cache，避免干扰 LMCache（测试用）

# Paged Attention（禁用 - 未调试完成）
LLAMA_PAGED_ATTENTION=0

# Chunk Prefill（批量处理 prompt，启用 LMCache prefill skip）
# 值越大，prefill 批处理越大，LMCache skip 效果越好
# 但会增加首 token 延迟。推荐：512-1024
THUNDERLLAMA_CHUNK_PREFILL=512

# ============================================================================
# KV Cache 策略配置（通过 API 设置）
# ============================================================================
KV_CACHE_STRATEGY="fixed"        # 策略类型: fixed | threshold | adaptive
KV_CACHE_LEVEL="f16"             # 量化级别: f16 | q8_0 | q4_0
# 说明: Q4_K 模型 + f16 KV cache（最优组合）
# Q4_K 模型: TG +19% (71.6 tok/s)
# f16 KV: 避免反量化开销，LMCache 加载最快

# ============================================================================
# 服务器基础配置
# ============================================================================
SERVER_PORT=30000
GPU_LAYERS=99                    # GPU offload 层数（99 = 全部）
PARALLEL_SLOTS=4                 # 并发槽位数

# ============================================================================
# 性能优化参数
# ============================================================================

# Flash Attention（10-30% 吞吐量提升）
FLASH_ATTENTION="on"             # on | off | auto

# Batch 配置
BATCH_SIZE=4096                  # 逻辑 batch size
UBATCH_SIZE=1024                 # 物理 batch size

# Continuous Batching
CONT_BATCHING=1                  # 动态批处理（默认启用）
PRIO_BATCH=2                     # 批处理优先级（0=normal, 3=realtime）

# Cache 配置
CACHE_REUSE=256                  # KV shifting 重用缓存（chunk size）
CACHE_RAM=16384                  # 内存缓存大小 (MB)
KV_UNIFIED=1                     # 统一 KV buffer（减少内存碎片）

# CPU 配置
CPU_THREADS=4                    # TG推理线程数（4=M4 Pro最优，减少GPU带宽争抢）
CPU_THREADS_BATCH=8              # PP批处理线程数（8=PP更快，prefill阶段GPU空闲多）
CPU_MASK="0xFF"                  # CPU 亲和性（8核可用，TG时仅4线程活跃）
PROCESS_PRIORITY=2               # 进程优先级（0=normal, 3=realtime）

# Metal/GPU 优化（macOS M4 Pro 特有）
NO_HOST=0                        # 绕过 host buffer（1=启用，可能不稳定）
METAL_MAX_BUFFER_SIZE=40000000000  # Metal 最大工作集 (40 GB)

# Metal Kernel Fusion（编译时优化，运行时开关）
# 包含: ADD 元素操作融合 + MoE Top-K Gating 融合
# 效果: Q5_K TG +10.5% (59→65), Q4_K TG +12.5% (70→79)
# 设为 0 仅用于调试/排错
METAL_FUSION=1                   # 1=启用（默认）, 0=禁用（调试用）

# ============================================================================
# 已验证无效的优化（不要使用！）
# ============================================================================
# ❌ Speculative Decoding (Draft Model): 质量下降，性能无提升
#    原因: 30B 模型验证成本高，0.6B draft 预测准确率低
#    记录: Cortex thunderllama-30b-spec-failed-2026
#
# ❌ N-gram Speculative Decoding: 质量下降，性能无提升
#    原因: N-gram 预测对大模型帮助有限
#
# SPECULATIVE_DECODING=0  # 强制禁用
# DRAFT_MODEL=""
# SPEC_TYPE="none"

# ============================================================================
# 日志和监控
# ============================================================================
LOG_FILE="/tmp/llama-server-30b.log"
VERBOSE=0                        # 详细日志（0=关闭，1=启用）

# ============================================================================
# 实验性功能（谨慎启用）
# ============================================================================
# 以下功能未充分测试，可能不稳定

# Auto-fit memory（自动调整参数以适应内存）
AUTO_FIT=1                       # 1=启用（默认）

# SWA (Sliding Window Attention) 完整缓存
SWA_FULL=0                       # 0=禁用（默认）

# Graph reuse（计算图复用）
GRAPH_REUSE=1                    # 1=启用（默认）

# ============================================================================
# 环境变量映射（不要手动修改）
# ============================================================================
# 以下变量会自动从上述配置生成
# THUNDER_LMCACHE
# THUNDER_LMCACHE_DISK_PATH
# THUNDER_PREFIX_MATCHING
# LLAMA_PAGED_ATTENTION
# THUNDERLLAMA_CHUNK_PREFILL
# GGML_METAL_MAX_BUFFER_SIZE
# GGML_METAL_FUSION_DISABLE (当 METAL_FUSION=0 时设置)

# ============================================================================
# 配置验证和预检查
# ============================================================================

# 检查模型文件是否存在
# 检查磁盘缓存路径是否可写
# 检查可用内存是否足够
# 检查 GPU 是否可用

# ============================================================================
# 性能基准（作为参考）
# ============================================================================
# 当前配置预期性能（基于实测 2026-03-15, build 8389+MoE fusion）:
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ Q5_K_M (20.23 GiB) — 默认模型                                │
# │   TG128:  65.25 ± 0.16 tok/s  (FA=1, fusion=1, t=4, 10-run)  │
# │   PP512:  729.47 ± 6.80 tok/s                                 │
# ├─────────────────────────────────────────────────────────────────┤
# │ Q4_K_M (17.28 GiB) — 速度优先                                │
# │   TG128:  79.12 ± 0.20 tok/s  (FA=1, fusion=1, t=4, 5-run)   │
# │   PP512:  787.50 ± 6.14 tok/s                                 │
# └─────────────────────────────────────────────────────────────────┘
