# MoE Fusion 提速效果 (fusion=0 → fusion=1):
#   Q5_K: 59.07 → 65.25 (+10.5%)
#   Q4_K: 70.35 → 79.12 (+12.5%)
#
# 服务器场景 (LMCache):
#   - 重复请求:       80-120 tok/s  (LMCache 缓存命中)
#   - RAG (前缀匹配): 75-90 tok/s   (Prefix Matching)
#   - 多轮对话:       65-80 tok/s   (LMCache + Prefix)
#
# 内存占用:
#   - 模型权重:       21.7 GB (Q5_K) / 17.3 GB (Q4_K)
#   - KV Cache (f16): 6.1 GB (满 4096 context, 48层×512维×4096)
#   - 总计:           ~28 GB (Q5_K) / ~24 GB (Q4_K)
#
# 并发能力:
#   - 并发槽位:       4
#   - 预期提升:       +50% (Paged Attention)

# ============================================================================
# 更新历史
# ============================================================================
# 2026-03-15: llama-server 字符串处理优化（HTTP 开销优化）
#   - 优化 process_token 函数中的字符串处理
#   - 修改文件: tools/server/server-context.cpp
#   - 优化项:
#     1. 使用引用避免 token_str 拷贝（const std::string& 代替 const std::string）
#     2. 增量 UTF-8 验证（只验证最后 4 字节，而非整个字符串）
#     3. 使用 std::string_view 避免 substr 创建临时字符串
#     4. 添加 find_stopping_strings 的 string_view 重载
#     5. 使用 assign 代替 substr 赋值
#   - 性能提升:
#     优化前: 47.21 tok/s
#     优化后: 61.15 tok/s (+29.5%)
#     llama-bench: 66 tok/s
#     开销: 7.3% (HTTP + slot 管理，已接近理论最优)
#   - 正确性: 端到端测试输出一致
#   - 结论: llama-server 开销从 29% 降低到 7%，已接近 llama-bench 性能
#
# 2026-03-15: Metal MoE Kernel Fusion（Tier 3 达成）
#   - 新增 kernel_topk_moe_f32 Metal 内核
#   - 融合 SOFT_MAX → ARGSORT → GET_ROWS 为 1 个 dispatch（原 3 个）
#   - 每 MoE 层减少 2 dispatches，48 层共减少 96 dispatches
#   - 修改文件: ggml-metal.metal, ggml-metal-ops.cpp, ggml-metal-impl.h,
#              ggml-metal-device.cpp, ggml-metal-device.h, ggml-metal-ops.h
#   - 算法: Simdgroup softmax → iterative top-8 argmax → weight normalization
#   - 适用: n_expert ≤ 256 且为 2 的幂次（Qwen3 n_expert=128）
#   - 10-run 稳定实测:
#     Q5_K_M: 无fusion=59.07 → 有fusion=65.25 (+10.5%)
#     Q4_K_M: 无fusion=70.35 → 有fusion=79.12 (+12.5%)
#   - 正确性: A/B 对比输出 byte-identical
#   - 配置项: METAL_FUSION=1 (默认启用), =0 禁用调试
#   - 注: Graph scheduler 将 MUL_MAT_ID 插在 GET_ROWS 和 SUM_ROWS 之间，
#         导致 normalization chain (SUM_ROWS→CLAMP→DIV) 无法一起融合。
#         当前实现只融合 gating 部分 (SOFT_MAX→ARGSORT→GET_ROWS)。
#
# 2026-03-14: Q4_K_M 量化 benchmark（Tier 2 达成）
#   - 使用 llama-quantize --allow-requantize 从 Q5_K_M 转换
#   - Q4_K_M: TG=75.90±0.23, PP512=766.84±4.33 (17.28 GiB, 4.86 BPW)
#   - Q5_K_M: TG=66.36±0.20, PP512=718.37±12.52 (20.23 GiB, 5.69 BPW)
#   - TG 提速: +14.4%（纯带宽瓶颈确认，模型缩小14.6%→TG快14.4%）
#   - 质量测试: 中文推理连贯，可用于日常任务
#   - 建议: 下载 HuggingFace 官方 Q4_K_M（直接从 f16 量化，质量更好）
#   - 模型文件: ~/models/qwen3-30b-a3b-gguf/Qwen3-30B-A3B-128K-Q4_K_M.gguf
#
# 2026-03-14: Metal GPU Profiling 分析
#   - 29 dispatches/layer × 48 layers = ~1392 total dispatches per token
#   - 元素操作融合已生效: nf=7 (7 ops fused per kernel)
#   - Q/K/V 并发 dispatch 已生效
#   - Graph reuse 已生效: TG128 复用 128/129 次
#   - 带宽利用率: ~63-68%，软件可寻址差距仅 ~8%
#   - 结论: Q5_K 在 M4 Pro 上已接近软件优化天花板
#
# 2026-03-14: CPU 线程数优化（分离 TG/PP 配置）
#   - CPU_THREADS: 8 → 4（TG推理，减少GPU带宽争抢）
#   - CPU_THREADS_BATCH: 8（PP批处理，保持8线程）
#   - 10-run 稳定测量:
#     threads=4: TG=66.36±0.20, PP=699.52±17.80
#     threads=8: TG=65.61±0.42, PP=718.37±12.52
#   - 结论: TG用4线程(+1.1%), PP用8线程(+2.7%), 分离配置
#   - 扫描范围: threads={2,4,6,8,10,12}，TG的甜区=4
#
# 2026-03-14: Q5_K Metal 内核参数调优
#   - N_R0_Q5_K: 1 → 8（每 simdgroup 处理 8 行，+2-3% TG）
#   - N_SG_Q5_K: 保持 2（增加 N_SG 会导致寄存器竞争）
#   - 修改文件: ggml/src/ggml-metal/ggml-metal-impl.h
#   - 参数搜索: N_R0={1,2,4,8,16} × N_SG={2,4}，7 组实测
#   - 结论: N_R0=8 是甜区，N_R0=16 寄存器溢出反而变慢
#   - 带宽利用率: ~65%（理论天花板 75-80% 的 ~85%）
#   - 更新性能基准: TG128=63.5 tok/s, PP512=690 tok/s
#
# 2026-03-14: Metal 内核优化分析
#   - KV_CACHE_LEVEL: q4_0 → f16（实测 f16 在 M4 Pro 上更快）
#   - 实测: q4_0 PP=573 TG=54.2 | q8_0 PP=670 TG=58.3 | f16 PP=686 TG=59.0
